<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Javich AccesoryShop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="forgot-password.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        /* Aplica el tema guardado ANTES de renderizar para evitar flash */
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'light') document.documentElement.classList.add('light-mode-pending');
            document.addEventListener('DOMContentLoaded', function() {
                if (saved === 'light') document.body.classList.add('light-mode');
                else document.body.classList.remove('light-mode');
            });
        })();
    </script>
</head>
<body>
    <main>
        <div class="forgot-container">
            <!-- ✅ FORMULARIO ORIGINAL -->
            <div id="forgot-form-container">
                <div class="forgot-header">
                    <i class="fas fa-key"></i>
                    <h2>¿Olvidaste tu contraseña?</h2>
                    <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.</p>
                </div>

                <div id="message-box" class="message-box" style="display: none;"></div>

                <form id="forgot-password-form">
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tu@correo.com" required autocomplete="email">
                    </div>
                    <button type="submit" id="btn-submit" class="btn-submit">
                        <i class="fas fa-paper-plane"></i> Enviar enlace
                    </button>
                </form>

                <div class="back-to-login">
                    <a href="index.html"><i class="fas fa-arrow-left"></i> Volver al inicio de sesión</a>
                </div>
            </div>

            <!-- ✅ PANTALLA DE ÉXITO (inicialmente oculta) -->
            <div id="success-container" style="display: none; text-align: center;">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2>¡Correo enviado!</h2>
                <p id="success-message">Hemos enviado un enlace de recuperación a tu correo electrónico.</p>
                
                <div class="redirect-info">
                    <p>Serás redirigido al inicio en <span id="countdown">5</span> segundos...</p>
                </div>

                <div class="success-actions">
                    <a href="index.html" class="btn-return-now">
                        <i class="fas fa-home"></i> Ir al catálogo ahora
                    </a>
                    <button onclick="showFormAgain()" class="btn-secondary-action">
                        <i class="fas fa-redo"></i> Enviar otro enlace
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="ui-helpers.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
