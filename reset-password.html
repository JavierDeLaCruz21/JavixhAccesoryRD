<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña - Javich AccesoryShop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="reset-password.css">
    <script>
        /* Aplica el tema guardado ANTES de renderizar para evitar flash */
        (function() {
            const saved = localStorage.getItem('theme');
            document.addEventListener('DOMContentLoaded', function() {
                if (saved === 'dark') document.body.classList.add('dark-mode');
                else document.body.classList.remove('dark-mode');
            });
        })();
    </script>
</head>
<body>
    <div class="reset-card">
        <h2><i class="fas fa-key"></i> Nueva contraseña</h2>
        <p class="reset-subtitle">Escribe la nueva contraseña para tu cuenta.</p>

        <div id="reset-message" class="reset-message" style="display: none;"></div>

        <form id="reset-form">
            <div class="form-group">
                <label for="new-password">Nueva contraseña</label>
                <div class="password-input-wrapper">
                    <input type="password" id="new-password" required minlength="8" placeholder="Mínimo 8 caracteres">
                    <button type="button" class="toggle-password" data-target="new-password"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirmar contraseña</label>
                <div class="password-input-wrapper">
                    <input type="password" id="confirm-password" required placeholder="Repítela">
                    <button type="button" class="toggle-password" data-target="confirm-password"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <button type="submit" class="btn-reset"><i class="fas fa-save"></i> Guardar contraseña</button>
        </form>

        <a class="back-link" href="index.html"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
    </div>
    <script src="reset-password.js"></script>
</body>
</html>
